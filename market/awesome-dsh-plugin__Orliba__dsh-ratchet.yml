url: https://github.com/Orliba/dsh-ratchet
name: Orliba/dsh-ratchet
category: workflow
description:
  en: 'Puts a delivery rhythm under the agent: align before work starts, then end every stage at a review checkpoint. ratchet_start scans the working directory first (CONTEXT.md, docs/adr, dependency manifest) and puts the remaining alignment questions into the question panel — at most five per round, each with a recommended option — skipping the toolchain question when a manifest is already there. ratchet_checkpoint stats every artifact the stage claims and prints the path with the line count it read from disk instead of trusting the summary, runs three vendored grill-with-docs linters over CONTEXT.md, docs/adr numbering and glossary-to-code consistency, and then offers continue / change direction / stop. Progress is a session projection, so it survives resume and fork; /ratchet opens the flow, /ratchet off closes it. A settings page exposes the enable switch, question cap, validator timeout, python path, stage cap and discipline text, and a save applies without a restart.'
  zh: '给 agent 套一层交付节奏：开工前先对齐，之后每一段都以一次验收收尾。ratchet_start 先扫工作目录（CONTEXT.md、docs/adr、依赖清单），把剩下要对齐的问题放进问询面板——一轮最多五题、每题带推荐项——目录里已有依赖清单时不再问技术栈。ratchet_checkpoint 会逐个核实这一段声称落盘的文件并打印读到的行数（不采信模型口述），再跑内置的 grill-with-docs 三个校验器检查 CONTEXT.md、docs/adr 编号与术语↔代码一致性，然后把「继续 / 换方向 / 停下」摆成选项。进度存在会话投影里，重启与分叉都不丢；/ratchet 开启流程、/ratchet off 关闭。设置页可改开关、每题上限、校验超时、python 路径、段数上限与纪律文案，保存即时生效无需重启。'
