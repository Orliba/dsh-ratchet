# Pointed at by dsh.bundle.patch when this package is installed into a profile.
# The id must stay `ratchet`: the settings namespace IS this entry id (dsh-settings
# resolves it via `configEditor.entries().find(row => row.options.id === ns)`), and
# renaming it makes the whole "Settings → Plugins → dsh-ratchet → Configuration"
# page disappear.
- insert:
    - id: ratchet
      name: dsh-ratchet
      config:
        enabled: true
        maxQuestions: 5
        validatorTimeoutMs: 20000
        stageLimit: 5
        # pythonPath: ''   # empty = auto-detect python / python3 / py -3 / the DSH bundled runtime
        # policyText: ''    # empty = use the six built-in discipline lines
